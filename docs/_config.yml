title: "Sentinel Enterprise AI Fabric"
description: "Risk-Driven Multi-Tenant RAG, Governed Autonomous Agent & Vector ETL Platform"
url: "https://rajeshwari229080.github.io"
baseurl: "/Datheon_Forward_Deployed_Engineering_Internship"

theme: jekyll-theme-primer
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

author:
  name: "Rajeshwari"
  url: "https://github.com/rajeshwari229080"

readme_index:
  enabled: true
  remove_originals: false

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
